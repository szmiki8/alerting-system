<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>

<header class="app-header">
  <div class="container app-header__inner">
    <span class="app-header__product">{{ productName }}</span>
    <nav class="app-nav" aria-label="Sign-up options">
      <ul class="app-nav__list">
        @for (link of navLinks; track link.path) {
          <li>
            <a
              class="app-nav__link"
              [routerLink]="link.path"
              routerLinkActive="app-nav__link--active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

<main #main id="main-content" class="container app-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="container">
    <p>{{ productName }}: hourly news alerts by email or Slack.</p>
  </div>
</footer>
