spring:
  datasource:
    url: jdbc:h2:mem:librarycheck;DB_CLOSE_DELAY=-1

resilience4j:
  retry:
    instances:
      smoke:
        max-attempts: 4
  ratelimiter:
    instances:
      smoke:
        limit-for-period: 2
        limit-refresh-period: 1s
  circuitbreaker:
    instances:
      smoke:
        sliding-window-size: 5
